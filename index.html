Buat minimal 8 efek luck acak.
Setiap luck event harus berisi:
• Nama event
• Jenis event: bonus, bantuan, rintangan, tantangan tambahan, kesempatan kedua, jalan pintas, atau kejutan
• Efek terhadap game
• Narasi singkat yang ramah anak
• Dampak terhadap skor atau indikator game
Contoh luck event:
• Kartu Bintang Pintar: tambah +5 poin
• Kartu Awan Bingung: hint berikutnya gratis
• Dadu Super: maju 2 langkah
• Jalan Berliku: harus menjawab 1 pertanyaan mini
• Kesempatan Kedua: boleh mengulang satu soal
• Bonus Fokus: alasan logis mendapat tambahan +3 poin
• Rintangan Kabut: pilihan jawaban diacak ulang
• Jalan Pintas: langsung lanjut ke tantangan berikutnya jika jawaban benar

Sistem Skor dan Nilai Murni
Buat sistem penilaian yang memisahkan antara nilai asesmen dan skor permainan.
Game wajib memiliki 4 jenis nilai:

A. Nilai Murni Jawaban Siswa
Nilai murni adalah nilai asli siswa berdasarkan jawaban terhadap soal atau tantangan utama.
Ketentuan:
• Nilai murni hanya dihitung dari jawaban soal/tantangan utama.
• Nilai murni tidak dipengaruhi oleh luck.
• Nilai murni tidak dipengaruhi oleh bonus, dadu, kartu keberuntungan, spin wheel, koin, energi, badge, atau efek acak.
• Nilai murni dicatat dari jawaban pertama siswa.
• Jika siswa diberi kesempatan mencoba lagi, percobaan kedua hanya untuk belajar dan skor game, bukan untuk mengubah nilai murni.
• Nilai murni harus ditampilkan di halaman akhir sebagai “Nilai Murni Asesmen”.
Contoh sistem nilai murni:
• Jawaban benar pada percobaan pertama: mendapat nilai penuh sesuai bobot soal.
• Jawaban salah pada percobaan pertama: mendapat 0 untuk nilai murni soal tersebut.
• Jawaban diperbaiki setelah feedback: boleh lanjut bermain, tetapi tidak mengubah nilai murni.
• Soal analisis atau isian singkat dapat diberi rubrik sederhana.
Rumus:
Nilai Murni = (Total skor murni siswa ÷ Total skor maksimal murni) × 100
Contoh:
Jumlah soal: 5
Bobot tiap soal: 20
Skor maksimal: 100
Siswa benar 4 soal pada jawaban pertama
Nilai Murni = 80

B. Skor Skill
Skor skill digunakan untuk kebutuhan permainan. Skor ini berasal dari kemampuan siswa selama bermain.
Skor Skill:
• Jawaban benar: +10 poin
• Alasan logis: +5 poin
• Menggunakan data/petunjuk dengan tepat: +5 poin
• Jawaban benar tetapi alasan kurang tepat: +10 poin saja
• Jawaban salah tetapi alasan masih logis: +3 poin
• Menggunakan hint: -2 poin dari skor skill
• Percobaan ulang boleh menambah skor game kecil, tetapi tidak mengubah nilai murni.

C. Skor Luck
Skor luck berasal dari efek acak selama permainan.
Skor Luck:
• Bonus kecil: +3 poin
• Bonus sedang: +5 poin
• Bonus besar: +10 poin
• Rintangan ringan: tidak mengurangi nilai murni
• Rintangan sedang: harus menjawab mini challenge
• Kesempatan kedua: boleh mengulang satu soal untuk lanjut bermain, tetapi tidak mengubah nilai murni
• Luck tidak boleh menghapus, menaikkan, atau menurunkan Nilai Murni Asesmen.

D. Nilai Game
Nilai game adalah nilai hiburan/permainan yang menggabungkan skill dan luck.
Rumus:
Nilai Game = (Skor Skill × 0,5) + (Skor Luck × 0,5)
Catatan:
Nilai Game boleh digunakan untuk badge, ranking game, reward, bintang, level, atau gelar pemain.
Nilai Game tidak sama dengan Nilai Murni Asesmen.

Skor Luck

Keseimbangan Skor Skill dan Luck
Buat perhitungan akhir dengan komposisi:

Jika Mapel, Topik, atau Jenjang belum ada sama sekali: berhenti dan tanyakan hanya yang kurang. Jika ketiganya sudah ada, LANGSUNG tampilkan urutan berikut dalam Bahasa Indonesia (JANGAN generate gambar dulu):

A. RINGKASAN DATA
Tabel singkat: field mana yang diisi guru dan field mana yang memakai default/usulan.

B. CHARACTER & STYLE BIBLE + ENVIRONMENT BIBLE (usulan)
- Tiap tokoh: nama, usia, jenis kelamin, warna kulit, model rambut, pakaian tetap (warna & detail), aksesoris pembeda, ekspresi khas, tinggi relatif antar-tokoh.
- Palet warna utama (3–5 warna).
- Gaya garis/render sesuai gaya terpilih.
- Lingkungan utama: tata ruang tetap, objek/perabot tetap beserta posisinya, arah cahaya, waktu, elemen pengenal tempat, agar latar identik di semua panel dan halaman.
- Rasio/format halaman sesuai pilihan.

C. TAWARAN ISI KONTEN KOMIK + NASKAH DIALOG
Tawarkan 2–3 opsi alur cerita, masing-masing berisi: judul, premis singkat, tokoh yang terlibat, pesan/tujuan pembelajaran, dan garis besar per halaman/panel (1 kalimat per panel). Untuk opsi yang paling direkomendasikan, sertakan draf Naskah Dialog per panel dalam tabel: nomor halaman, nomor panel, nama tokoh yang bicara, isi dialog/narasi (maks 8–10 kata), agar guru bisa langsung mengoreksi kalimat sebelum digambar. Konsep {{mapel}}/{{topik}} harus benar secara keilmuan. Guru boleh memilih satu, menggabungkan, mengedit naskah dialog, atau meminta opsi baru.

D. KONFIRMASI DATA TAMBAHAN
Tampilkan checklist bernomor yang singkat, tiap butir dengan rekomendasi Anda, agar guru cukup menjawab ringkas (mis. "1A, 2B, sisanya sesuai rekomendasi"):
1. Pilihan alur cerita (opsi mana/gabungan).
2. Tokoh: jumlah, nama, dan ciri khas (setuju dengan usulan atau ubah).
3. Latar/lingkungan (setuju atau ubah).
4. Gaya visual (setuju atau ganti).
5. Format halaman: kertas + orientasi (A4 Potret / A4 Lanskap / lainnya).
6. Jumlah halaman dan jumlah panel per halaman.
7. Mode output file (M1 / M2 / M3 / M4), dan jika M2, jumlah panel per file.
8. Mode teks/dialog: T1 (balon terisi di dalam gambar) atau T2 (tanpa balon, caption di bawah panel).
9. Naskah Dialog per panel (setuju dengan draf atau ada revisi kalimat).
10. Tujuan pembelajaran dan tingkat bahasa (setuju atau ubah).
11. Catatan khusus (mis. logo sekolah, warna tema, istilah wajib, hal yang harus dihindari).

E. KONFIRMASI MULAI GENERATE
Tampilkan ringkasan konfigurasi final (format halaman, jumlah halaman/panel, mode file, mode teks, jumlah file, jumlah batch, gaya, alur terpilih, status naskah dialog), lalu tanyakan:
"Apakah halaman/panel komik sudah bisa mulai digenerate dengan konfigurasi ini?"
Pilihan: (1) Ya, generate sekarang; (2) Ya, tetapi ubah bagian tertentu (sebutkan); (3) Revisi konten/tokoh/latar/naskah dulu.
Guru juga boleh membalas "LANJUT" untuk memakai semua rekomendasi.
Setelah itu BERHENTI dan tunggu jawaban guru.

2. STRUKTUR PROMPT GAMBAR (per file):

   - Negative prompt: anatomi tangan/jari cacat, wajah asimetris tidak wajar, wajah/pakaian berubah antar-panel, teks buram/tidak terbaca/gibberish, kalimat berbeda dari Naskah Dialog, balon dialog muncul padahal mode T2 dipilih (atau sebaliknya tidak ada balon padahal mode T1), elemen tidak relevan dengan topik, latar berbeda dari Environment Bible, konten tidak pantas untuk siswa {{jenjang}}.
3. PEMERIKSAAN tiap file setelah generate: (a) jumlah panel sesuai peta, (b) urutan baca benar, (c) tokoh, kostum, dan latar konsisten dengan Bible, (d) konsep {{mapel}}/{{topik}} akurat, (e) untuk T1: balon ada di posisi yang benar dan teksnya persis sesuai Naskah Dialog, terbaca, tidak gibberish; untuk T2: tidak ada bentuk balon sama sekali dan caption di bawah panel persis sesuai Naskah Dialog, terbaca, tidak gibberish, atau area caption dibiarkan polos jika memang dikosongkan, (f) tangan/wajah/anatomi wajar, (g) format kertas/rasio sesuai, margin aman dan gutter terjaga, tidak ada elemen yang melewati batas panel.
4. HASIL BATCH: tampilkan tabel nomor file, nama file, halaman/panel, format kertas, mode teks, status Selesai/Perlu Ulang. Yang gagal diregenerate saja (satu per satu atau batch kecil; ikuti aturan turun ke T2 pada Daftar Mode Teks bila T1 gagal berulang), lalu diperiksa ulang. Ikuti aturan Batch poin 4 untuk kelanjutan antar-batch.

/* ===== KATEGORI PROMPT VERSI BIASA =====
   Diambil dari paket September 2026 agar isi prompt tetap sama,
   tetapi sekarang dipisah menjadi Aplikasi, MPI, dan Game. */
const versiBiasaSource = paket2026Categories.flatMap(cat => cat.prompts || []);
const biasaCategories = [
  {
    id: "biasa-aplikasi",
    name: "Versi Biasa — Aplikasi",
    icon: "🧩",
    keywords: "prompt versi biasa aplikasi ideasi rancangan kode canva code administrasi pembelajaran",
    prompts: versiBiasaSource.filter(p => /Aplikasi/i.test(p.title))
  },
  {
    id: "biasa-mpi",
    name: "Versi Biasa — MPI",
    icon: "🎓",
    keywords: "prompt versi biasa mpi media pembelajaran interaktif ideasi rancangan kode canva code",
    prompts: versiBiasaSource.filter(p => /\bMPI\b/i.test(p.title))
  },
  {
    id: "biasa-game",
    name: "Versi Biasa — Game",
    icon: "🎮",
    keywords: "prompt versi biasa game edukasi sederhana critical thinking luck skill ideasi rancangan kode canva code",
    prompts: versiBiasaSource.filter(p => /Game/i.test(p.title))
  }
];

const promptCategories = [
  ...biasaCategories,
  ...simulasi2026Categories,
  ...kuis2026Categories,
  ...pro2026Categories,
  ...universalCategories,
  ...teacherContentCategories,
  ...extraCategories,
  ...advancedCategories,
  ...coreCategories
];

/* ===== APLIKASI ===== */
const $ = s => document.querySelector(s);
const state = { category:'all', query:'', favoritesOnly:false, active:null };
const favorites = new Set(JSON.parse(localStorage.getItem('bankPromptFavorites') || '[]'));
const allPrompts = promptCategories.flatMap((cat, ci) => (cat.prompts || []).map((p, pi) => ({...p, categoryId:cat.id, categoryName:cat.name, icon:cat.icon || '💡', key:`${cat.id}::${pi}`, catIndex:ci, promptIndex:pi})));

const els = {
  catList:$('#catList'), grid:$('#promptGrid'), search:$('#searchInput'), viewTitle:$('#viewTitle'), viewSubtitle:$('#viewSubtitle'),
  statCats:$('#statCats'), statPrompts:$('#statPrompts'), statShown:$('#statShown'), sidebar:$('#sidebar'), mobileShade:$('#mobileShade'),
  drawer:$('#drawer'), backdrop:$('#drawerBackdrop'), drawerTitle:$('#drawerTitle'), drawerCat:$('#drawerCat'), drawerText:$('#drawerText'),
  favFullBtn:$('#favFullBtn'), themeBtn:$('#themeBtn')
};

function escapeHtml(s=''){return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function normalize(s=''){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function saveFavs(){localStorage.setItem('bankPromptFavorites',JSON.stringify([...favorites]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1500)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Prompt berhasil disalin');}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Prompt berhasil disalin');}}
function truncate(s,n=175){return s.length>n?s.slice(0,n).trimEnd()+'…':s;}

function renderCategories(){
  els.catList.innerHTML = promptCategories.map(cat=>`<button class="cat-btn ${state.category===cat.id&&!state.favoritesOnly?'active':''}" data-cat="${escapeHtml(cat.id)}"><span class="cat-icon">${cat.icon||'💡'}</span><span class="cat-name">${escapeHtml(cat.name)}</span><span class="cat-count">${(cat.prompts||[]).length}</span></button>`).join('');
  els.catList.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{state.category=btn.dataset.cat;state.favoritesOnly=false;closeSidebar();render();}));
}
function searchScore(p,q){
  if(!q) return 0;
  const title=normalize(p.title), category=normalize(p.categoryName), text=normalize(p.text);
  const words=q.split(/\s+/).filter(Boolean);
  if(title===q) return 0;
  if(title.startsWith(q)) return 1;
  if(title.includes(q)) return 2;
  if(words.length>1 && words.every(w=>title.includes(w))) return 3;
  if(category===q || category.startsWith(q)) return 4;
  if(category.includes(q)) return 5;
  if(text.includes(q)) return 6;
  const combined=`${title} ${category} ${text}`;
  if(words.every(w=>combined.includes(w))) return 7;
  return Infinity;
}
function filtered(){
  const q=normalize(state.query.trim());
  return allPrompts
    .map((p,index)=>({p,index,score:searchScore(p,q)}))
    .filter(({p,score})=>{
      if(state.favoritesOnly && !favorites.has(p.key)) return false;
      if(!state.favoritesOnly && state.category!=='all' && p.categoryId!==state.category) return false;
      return !q || Number.isFinite(score);
    })
    .sort((a,b)=>a.score-b.score || a.index-b.index)
    .map(({p})=>p);
}
function render(){
  renderCategories();
  const list=filtered();
  let title='Semua Prompt';
  if(state.favoritesOnly) title='Prompt Favorit';
  else if(state.category!=='all'){title=promptCategories.find(c=>c.id===state.category)?.name || 'Kategori';}
  els.viewTitle.textContent=title;
  els.viewSubtitle.textContent=state.query?`Hasil pencarian untuk “${state.query}”`:'Temukan prompt, buka detail, lalu salin untuk digunakan di Canva Code atau AI pilihan Anda.';
  els.statCats.textContent=`${promptCategories.length} kategori`;
  els.statPrompts.textContent=`${allPrompts.length} prompt`;
  els.statShown.textContent=`${list.length} tampil`;
  if(!list.length){els.grid.innerHTML='<div class="empty">Tidak ada prompt yang cocok. Coba kata kunci lain atau pilih kategori berbeda.</div>';return;}
  els.grid.innerHTML=list.map(p=>`<article class="card">
    <div class="card-top"><div class="card-emoji">${p.icon}</div><div class="card-title">${escapeHtml(p.title)}</div><button class="fav ${favorites.has(p.key)?'on':''}" data-fav="${escapeHtml(p.key)}" title="Favorit">★</button></div>
    <div class="cat-label">${escapeHtml(p.categoryName)}</div>
    <div class="preview">${escapeHtml(truncate(p.text.replace(/\s+/g,' '),210))}</div>
    <div class="card-actions"><button class="primary" data-open="${escapeHtml(p.key)}">Buka Prompt</button><button data-copy="${escapeHtml(p.key)}">📋 Salin</button></div>
  </article>`).join('');
  els.grid.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPrompt(b.dataset.open)));
  els.grid.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{const p=allPrompts.find(x=>x.key===b.dataset.copy);if(p)copyText(p.text);}));
  els.grid.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>toggleFav(b.dataset.fav)));
}
function toggleFav(key){favorites.has(key)?favorites.delete(key):favorites.add(key);saveFavs();if(state.active?.key===key)updateDrawerFav();render();}
function updateDrawerFav(){if(!state.active)return;els.favFullBtn.textContent=favorites.has(state.active.key)?'★ Hapus dari Favorit':'☆ Simpan Favorit';}
function openPrompt(key){const p=allPrompts.find(x=>x.key===key);if(!p)return;state.active=p;els.drawerTitle.textContent=p.title;els.drawerCat.textContent=`${p.icon} ${p.categoryName}`;els.drawerText.textContent=p.text;updateDrawerFav();els.drawer.classList.add('open');els.backdrop.classList.add('open');els.drawer.setAttribute('aria-hidden','false');}
function closeDrawer(){els.drawer.classList.remove('open');els.backdrop.classList.remove('open');els.drawer.setAttribute('aria-hidden','true');}
function openSidebar(){els.sidebar.classList.add('open');els.mobileShade.classList.add('open')}
function closeSidebar(){els.sidebar.classList.remove('open');els.mobileShade.classList.remove('open')}
function applyTheme(){const t=localStorage.getItem('bankPromptTheme')||'dark';document.documentElement.dataset.theme=t;els.themeBtn.textContent=t==='dark'?'☀️':'🌙'}

$('#allBtn').addEventListener('click',()=>{state.category='all';state.favoritesOnly=false;render();closeSidebar()});
$('#favBtn').addEventListener('click',()=>{state.category='all';state.favoritesOnly=true;render();closeSidebar()});
els.search.addEventListener('input',e=>{state.query=e.target.value;render()});
$('#randomBtn').addEventListener('click',()=>{const list=filtered();if(list.length)openPrompt(list[Math.floor(Math.random()*list.length)].key)});
els.themeBtn.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('bankPromptTheme',next);applyTheme()});
$('#menuBtn').addEventListener('click',openSidebar);els.mobileShade.addEventListener('click',closeSidebar);
$('#drawerClose').addEventListener('click',closeDrawer);els.backdrop.addEventListener('click',closeDrawer);
$('#copyFullBtn').addEventListener('click',()=>state.active&&copyText(state.active.text));
els.favFullBtn.addEventListener('click',()=>state.active&&toggleFav(state.active.key));
$('#downloadBtn').addEventListener('click',()=>{if(!state.active)return;const blob=new Blob([state.active.text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.active.title.replace(/[^a-z0-9\- _]/gi,'').trim()||'prompt')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeSidebar()}});
applyTheme();render();
</script>
